function header(r){const ready=r.status==='ready';return '<header class="main-header"><div class="row spread"><div class="breadcrumb"><button class="mobile-list-button" data-action="mobile-list">'+icon('back')+'录音库</button><span>整理场景</span>'+icon('chevron')+'<button data-action="classify" class="template-link">'+esc(sceneName(r.scene))+'</button></div><span class="pill '+(ready?'ok':r.status==='failed'?'fail':'blue')+'">'+(ready?(r.transcriptOnly?'已转写':'已整理'):r.status==='failed'?'需要重试':r.status==='needs_review'?'场景待确认':r.status==='queued'?'排队中':r.status==='cancelled'?'已取消':'处理中')+'</span></div><div class="title-row"><h1>'+esc(r.title)+'</h1><div class="tools"><button class="btn" data-action="export" '+(!ready?'disabled title="整理完成后可导出"':'')+'>'+icon('export')+'<span class="export-label">导出</span></button><div class="menu-wrap"><button class="icon-btn" data-action="menu" aria-label="录音操作" aria-expanded="'+ui.menu+'">'+icon('more')+'</button>'+(ui.menu?'<div class="menu" role="group" aria-label="录音操作"><button data-action="rename">'+icon('edit')+'重命名</button><button data-action="classify">'+icon('folder')+'修改分类</button><button data-action="regenerate" '+(!ready?'disabled':'')+'>'+icon('refresh')+'重新整理</button></div>':'')+'</div></div></div><div class="file-meta"><span>'+icon('file')+esc(r.file)+'</span><span>'+icon('clock')+time(r.duration)+'</span><span>'+icon('people')+r.speakers.length+' 位说话人</span></div>'+(r.dirty?'<div class="notice warn">'+icon('warning')+'<div>角色或整理场景已调整。已有总结保留，重新整理后生成新版本。 <button class="link-btn" data-action="regenerate">重新整理</button></div></div>':'')+(ready?'<div class="tabs-line"><div class="tabs" role="tablist" aria-label="录音内容">'+[['summary','复盘总结'],['transcript','逐字稿'],['review','待核对']].map(([id,name])=>'<button role="tab" aria-selected="'+(ui.tab===id)+'" class="tab '+(ui.tab===id?'active':'')+'" data-action="tab" data-id="'+id+'">'+name+(id==='review'&&r.unresolved?'<span class="number">'+r.unresolved+'</span>':'')+'</button>').join('')+'</div><button class="template-link" data-action="open-template">'+icon('rules')+'模板 '+esc(r.sceneSnapshot?.version||scenes.find(p=>p.id===r.scene)?.version||'1.0.0')+'</button></div>':'')+'</header>'}
function roleChips(r){return '<div class="speakers" aria-label="根据内容推断的角色">'+r.speakers.map((p,i)=>'<button class="speaker" data-action="speakers"><b>'+String(i+1).padStart(2,'0')+'</b>'+esc(roles[p.role])+'</button>').join('')+'</div>'}
function summary(r){if(r.scene==='consultation')return '<div class="reading-inner"><div class="doc-label">问诊信息整理<span class="line"></span>示例内容</div><h2 class="summary-heading">把沟通中的安排，留成一份备忘。</h2><p class="lede">此虚构示例仅展示问诊类目的内容组织，不提供诊断或治疗建议。正式结果将区分对话事实、医嘱来源与待确认事项。</p>'+roleChips(r)+'<div class="stack"><h3>沟通要点</h3><p class="lede">按时间线整理本次沟通中提及的情况，重要信息回到录音原文核对。</p></div><div class="stack"><h3>后续安排</h3><label class="check"><input type="checkbox" data-check="0"><span class="check-label">回听确认对话中提及的复诊时间。</span></label></div><div class="notice">'+icon('shield')+'<div>原型未附问诊音频和诊疗内容。点击右上角可重命名或更换分类。</div></div></div>';
const technical=r.scene!=='hr';return '<div class="reading-inner"><div class="doc-label">候选人视角<span class="line"></span>复盘版本 '+r.version+'</div><h2 class="summary-heading">'+(technical?'从项目经历，聊到系统背后的取舍。':'从职业选择，聊到如何与团队协作。')+'</h2><p class="lede">'+(technical?'本次对话围绕消息处理、异步架构与工程实践展开。你说明了方案的基本思路；下一次可以补充关键边界，以及支撑决策的具体场景。':'本次对话围绕求职动机、协作经历与岗位预期展开。建议把具体情境、自己的行动和结果连起来讲，并核对尚未明确的后续安排。')+'</p>'+roleChips(r)+'<section class="stack"><div class="section-head"><h3>关键问答</h3><span>事实与建议分开呈现</span></div><details class="qa" open><summary>'+(technical?'消息重复消费，你是怎么处理的？':'如何讲述一次有分歧的协作经历？')+icon('down')+'</summary><div class="qa-answer"><div><span class="answer-label">你的回答</span><p>'+(technical?'以事件 ID 做幂等，已成功处理的消息直接返回；失败消息进入重试队列。':'先说明共同目标，再描述分歧和沟通过程，最后交代实际结果。')+' '+(technical?cite('s04'):'<span class="pill">虚构结构示例</span>')+'</p></div><div class="advice">准备建议：'+(technical?'补充幂等记录的生命周期，并说明确认失败与业务成功之间的恢复方式。':'准备一个具体案例，区分团队行动和自己的贡献。')+'</div></div></details><details class="qa"><summary>'+(technical?'为什么引入异步，而不是全部同步完成？':'你期待怎样的团队与工作方式？')+icon('down')+'</summary><div class="qa-answer"><p>'+(technical?'关键交易保留同步，非关键路径异步化；允许短暂延迟，同时需要补偿和监控。 '+cite('s08'):'把个人偏好与岗位实际需求对应，不补造对方没有提供的信息。')+'</p><div class="advice">准备建议：用一个完整场景说明选择的收益与代价。</div></div></details></section><section class="stack"><div class="section-head"><h3>下一次，带上这些准备</h3><span>手动勾选完成</span></div><div class="action-list">'+(technical?['画一张消息处理时序图，覆盖重复与重试。','补充一个体现架构取舍的具体项目案例。','回听待核对片段，确认术语和说话人。']:['整理一个完整的团队协作案例。','列出需要向招聘方确认的岗位问题。','核对对话中提及的后续时间安排。']).map((t,i)=>'<label class="check"><input type="checkbox" data-check="'+i+'" '+(r.checks.includes(i)?'checked':'')+'><span class="check-label">'+t+'</span></label>').join('')+'</div></section>'+(r.unresolved?'<div class="notice warn">'+icon('warning')+'<div><strong>还有 '+r.unresolved+' 处需要回听</strong><br>一处说话人归属不明，一处术语待核对。 <button class="link-btn" data-action="tab" data-id="review">查看待核对内容</button></div></div>':'')+'<p class="small muted">模型整理草稿。建议与原文一起阅读，不将转写误识视为个人能力问题。</p></div>'}
function transcript(r){return '<div class="reading-inner"><div class="segment-filter"><label for="speaker-filter">筛选说话人</label><select id="speaker-filter">'+option('all','全部说话人',ui.transcriptSpeaker)+r.speakers.map((p,i)=>option(String(i),p.name+' / '+roles[p.role],ui.transcriptSpeaker)).join('')+option('unknown','归属待确认',ui.transcriptSpeaker)+'</select><span>片段时间示例</span></div><div class="transcript-list">'+recordSources(r).filter(s=>ui.transcriptSpeaker==='all'||ui.transcriptSpeaker===(s.speaker===null?'unknown':String(s.speaker))).map(s=>'<section class="transcript-block '+(ui.evidence===s.id?'active':'')+'"><div class="who"><button class="link-btn" data-action="speakers">'+(s.speaker===null?'说话人待确认':esc(r.speakers[s.speaker]?.name||'发言人')+' / '+esc(roles[r.speakers[s.speaker]?.role||'unknown']))+'</button><button class="cite" data-action="cite" data-id="'+s.id+'">'+time(s.at)+'</button></div><p>'+esc(s.text)+'</p></section>').join('')+'</div><div class="notice">'+icon('file')+'<div>原型用少量虚构片段演示检索与引用；未加载完整音频或真实转写。</div></div></div>'}
function reviewContent(r){return '<div class="reading-inner"><div class="stack"><h2>保留不确定，再回到原话。</h2><p class="lede">未可靠归属的内容不会强行算作某个人的回答。</p></div>'+(r.unresolved?'<div class="notice warn">'+icon('warning')+'<div><strong>说话人归属待确认</strong><br>18:42 后的接话可能包含多人声音。 '+cite('s05')+'</div></div><div class="notice warn">'+icon('warning')+'<div><strong>技术术语待核对</strong><br>对齐结果保留原始识别文字，需回听确认。 '+cite('s06')+'</div></div><button class="btn" data-action="speakers">'+icon('people')+'更正参与者角色</button>':'<div class="notice ok">'+icon('check')+'<div>当前示例没有单独标记的待核对项。模型未标记不代表内容已经人工确认。</div></div>')+'<p class="small muted">这里是后续功能的交互示意，尚未连接真实人工校正流程。</p></div>'}
function evidence(r){if(!ui.evidence)return'';const list=recordSources(r),focus=list.find(s=>s.id===ui.evidence)||list[1];const index=list.indexOf(focus),near=list.slice(Math.max(0,index-1),Math.min(list.length,index+2));return '<aside class="evidence" aria-label="原文核对"><div class="evidence-head"><h3>原文核对</h3><button class="icon-btn" data-action="close-evidence" aria-label="关闭原文核对">'+icon('close')+'</button></div><div class="evidence-context">引用 '+time(focus.at)+'，保留前后文</div><div class="evidence-transcript">'+near.map(s=>'<section class="utterance '+(s.id===focus.id?'active':'')+'"><div class="who"><strong>'+(s.speaker===null?'归属待确认':esc(roles[r.speakers[s.speaker]?.role||'unknown']))+'</strong><button class="cite" data-action="seek" data-id="'+s.id+'">'+time(s.at)+'</button></div><div class="quote">'+esc(s.text)+'</div></section>').join('')+'</div><div class="evidence-foot"><button class="link-btn" data-action="tab" data-id="transcript">查看逐字稿上下文</button><p>角色来自内容推断，可能有误。原型使用虚构文字，时间轴仅演示定位。</p></div></aside>'}
function player(r){return '<footer class="player"><button class="play" data-action="play" aria-label="'+(ui.playing?'暂停时间轴演示':'开始时间轴演示，无音频')+'">'+icon(ui.playing?'pause':'play')+'</button><span class="time" id="play-position">'+time(ui.position)+'</span><div class="wave" aria-hidden="true">'+[5,11,8,16,10,6,13,17,8,12,5,10].map(h=>'<i style="height:'+h+'px"></i>').join('')+'</div><label class="sr-only" for="seek-range">示例录音时间位置</label><input type="range" min="0" max="'+r.duration+'" value="'+Math.min(ui.position,r.duration)+'" id="seek-range"><span class="time">'+time(r.duration)+'</span><button class="speed" data-action="speed" aria-label="时间轴演示速度">'+ui.speed.toFixed(1)+'×</button><span class="player-caption">时间轴演示，无音频</span></footer>'}
function settingsPage(){return '<main class="view-full scene-workspace settings-workspace"><header class="scene-page-header"><h1>设置</h1></header><div class="scene-split"><aside class="scene-library"><div class="scene-library-head"><h2>设置项</h2></div><nav class="scene-index" aria-label="设置分类">'+[['models','AI 模型与 API'],['storage','存储位置']].map(([id,label])=>'<button class="scene-list-row '+(ui.settingsTab===id?'active':'')+'" data-action="settings-tab" data-id="'+id+'" '+(ui.settingsTab===id?'aria-current="page"':'')+'><strong>'+label+'</strong></button>').join('')+'</nav></aside>'+(ui.settingsTab==='models'?modelSettings():storageSettings())+'</div></main>'}
function modelSettings(){return '<form id="model-form" class="scene-editor settings-editor" novalidate><header class="scene-editor-head"><div class="editor-heading"><h2>AI 模型与 API</h2></div><div class="editor-actions"><button class="btn" id="test-model" type="button" data-action="test-model">检查连接</button><button class="btn primary" type="submit">保存模型配置</button></div></header><section class="scene-fields"><div class="field-grid"><div class="field"><label for="provider">服务商</label><select class="input" id="provider" name="provider">'+option('deepseek','DeepSeek',config.provider)+option('compatible','兼容 OpenAI 的服务',config.provider)+option('local','本地模型服务',config.provider)+'</select></div><div class="field"><label for="model">模型名称</label><input class="input" id="model" name="model" value="'+esc(config.model)+'" placeholder="例如 deepseek-flash" required></div></div><div class="field"><label for="endpoint">API 地址</label><input class="input" id="endpoint" name="endpoint" type="url" value="'+esc(config.endpoint)+'" placeholder="https://api.example.com" required><span class="help">用于场景生成、匹配和总结。</span></div><div class="field"><label for="api-key">API Key <span id="key-optional" class="muted small">'+(config.provider==='local'?'（本地服务可留空）':'')+'</span></label><div class="input-row"><input class="input mono" id="api-key" name="apiKey" type="password" autocomplete="off" spellcheck="false" value="'+esc(config.apiKey)+'" placeholder="仅输入演示值 demo-key"><button class="btn" type="button" data-action="reveal-key" aria-label="显示 API Key" aria-pressed="false">'+icon('eye')+'</button></div><span class="help">仅用 demo-key 演示，请勿输入真实密钥。</span></div><div class="row wrap"><span id="model-message" role="status" class="small muted">尚未检查演示连接</span></div><p class="field-error" id="model-error" role="alert"></p><p class="small muted">演示配置，刷新清空。</p></section></form>'}
function joined(root,relative){const sep=/^[A-Za-z]:/.test(root)?'\\':'/';return root.replace(/[\\/]+$/,'')+sep+relative.replace(/[\\/]+/g,sep)}
function storageSettings(){return '<form id="storage-form" class="scene-editor settings-editor" novalidate><header class="scene-editor-head"><div class="editor-heading"><h2>存储位置</h2></div><div class="editor-actions"><button class="btn primary" type="submit">预览目录变更</button></div></header><section class="scene-fields"><div class="field"><label for="platform">路径格式</label><select class="input" id="platform" name="platform">'+option('mac','macOS',config.platform)+option('windows','Windows',config.platform)+'</select></div><div class="field"><label for="workspace-path">工作区目录</label><input class="input mono" id="workspace-path" name="workspace" value="'+esc(config.workspace)+'" required><span class="help">工作区绝对路径。</span></div><div class="field"><label for="models-path">模型文件目录</label><input class="input mono" id="models-path" name="models" value="'+esc(config.models)+'" required><span class="help">工作区内的相对路径。</span><span class="path" id="models-preview">'+esc(joined(config.workspace,config.models))+'</span></div><div class="field"><label for="cache-path">模型下载与运行缓存目录</label><input class="input mono" id="cache-path" name="cache" value="'+esc(config.cache)+'" required><span class="help">工作区内的相对路径。</span><span class="path" id="cache-preview">'+esc(joined(config.workspace,config.cache))+'</span></div><p class="field-error" id="storage-error" role="alert"></p><p class="small muted">更改目录不会迁移已有文件。</p></section></form>'}
function openDialog(title,subtitle,body,footer,formId=''){ui.menu=false;lastFocus=document.activeElement;const menu=document.querySelector('.menu');if(menu){if(menu.contains(lastFocus))lastFocus=document.querySelector('[data-action=menu]');menu.remove();document.querySelector('[data-action=menu]')?.setAttribute('aria-expanded','false')}const d=document.getElementById('dialog');d.innerHTML=(formId?'<form id="'+formId+'" novalidate>':'')+'<header class="dialog-head"><div><h2 id="dialog-title">'+title+'</h2>'+(subtitle?'<p>'+subtitle+'</p>':'')+'</div><button class="icon-btn" type="button" data-action="close-dialog" aria-label="关闭对话框">'+icon('close')+'</button></header><div class="dialog-body">'+body+'</div><footer class="dialog-foot">'+(footer||'<button class="btn" type="button" data-action="close-dialog">关闭</button>')+'</footer>'+(formId?'</form>':'');if(!d.open)d.showModal();const f=d.querySelector('input:not([type="checkbox"]),select,textarea');if(f)setTimeout(()=>f.focus(),0)}
function closeDialog(){generationTicket++;generationBusy=false;document.getElementById('dialog').close()}
function renameDialog(){const r=current();openDialog('重命名录音','标题与原始文件名分开管理，避免丢失文件来源。','<div class="field"><label for="rename-title">录音标题</label><input class="input" id="rename-title" name="title" maxlength="120" value="'+esc(r.title)+'" required></div><label class="check"><input type="checkbox" id="rename-file-toggle" name="renameFile"><span>同步重命名原始音频文件</span></label><div class="field"><label for="rename-file">原始文件名</label><input class="input" id="rename-file" name="file" value="'+esc(r.file)+'" disabled><span class="help">保留 .m4a 扩展名；正式版检查同名冲突，并同步文件引用。</span></div><div class="notice">'+icon('file')+'<div>原型只更新虚构列表，不修改本地文件、音频内容或已有结果。</div></div><p id="rename-error" class="field-error" role="alert"></p>','<button class="btn" type="button" data-action="close-dialog">取消</button><button class="btn primary" type="submit">保存名称</button>','rename-form')}
function speakersDialog(){const r=current();openDialog('参与者与角色','声音编号与对话角色是两回事。未确定的角色可以保留未知。',r.speakers.map((p,i)=>'<div class="field-grid keep-two"><div class="field"><label for="speaker-name-'+i+'">声音 '+String(i+1).padStart(2,'0')+' 的名称</label><input class="input" name="name'+i+'" id="speaker-name-'+i+'" value="'+esc(p.name)+'" maxlength="40" required></div><div class="field"><label for="speaker-role-'+i+'">对话角色</label><select class="input" name="role'+i+'" id="speaker-role-'+i+'">'+Object.entries(roles).map(([k,n])=>option(k,n,p.role)).join('')+'</select></div></div>').join('')+'<div class="notice">'+icon('people')+'<div>更正角色只影响后续整理，不重新做声音聚类。原型仅更新示例标注。</div></div><p id="speaker-error" class="field-error" role="alert"></p>','<button class="btn" type="button" data-action="close-dialog">取消</button><button class="btn primary" type="submit">保存角色</button>','speakers-form')}
function exportDialog(){openDialog('导出这份声笺','仅导出虚构示例内容，不包含真实录音或凭据。','<div class="notice">'+icon('file')+'<div><strong>Markdown 文档</strong><br>包括总结、行动清单与示例来源。可继续在笔记软件中编辑。</div></div>','<button class="btn" type="button" data-action="close-dialog">取消</button><button class="btn primary" type="button" data-action="download">下载示例 Markdown</button>')}
function validateModel(form){const d=new FormData(form),values=Object.fromEntries(d);if(!String(values.model||'').trim())return{error:'请填写模型名称。'};let url;try{url=new URL(values.endpoint)}catch{return{error:'请填写有效的 API 地址。'}}if(!['http:','https:'].includes(url.protocol))return{error:'API 地址需要以 https:// 或 http:// 开头。'};if(url.protocol!=='https:'&&!['localhost','127.0.0.1','[::1]'].includes(url.hostname))return{error:'云端 API 请使用 HTTPS；HTTP 仅用于本地服务。'};if(values.provider!=='local'&&!String(values.apiKey||'').trim())return{error:'请填写演示密钥 demo-key；请勿使用真实密钥。'};return{values:{provider:values.provider,endpoint:values.endpoint.trim(),model:values.model.trim(),apiKey:values.apiKey.trim()}}}
async function testConnection(){const form=document.getElementById('model-form'),result=validateModel(form),message=document.getElementById('model-message');document.getElementById('model-error').textContent=result.error||'';if(result.error){form.querySelector(!form.model.value.trim()?'#model':'#endpoint').focus();return}const btn=document.getElementById('test-model');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>检查中';message.textContent='模拟连接中，不发送网络请求…';await new Promise(r=>setTimeout(r,800));if(!btn.isConnected)return;btn.disabled=false;btn.textContent='检查连接';const success=result.values.provider==='local'||result.values.apiKey==='demo-key';message.textContent=success?'演示：连接通过，JSON 返回有效。':'演示：认证失败。请用 demo-key 重试。';message.style.color=success?'var(--success)':'var(--danger)';config.connection=success?'passed':'failed';announce(message.textContent)}

function generatedScene(brief){
 const seed=/快递|配送|取件/.test(brief)?scenes.find(s=>s.id==='delivery'):/问诊|医嘱|病史/.test(brief)?scenes.find(s=>s.id==='consultation'):/HR|薪酬|职业/.test(brief)?scenes.find(s=>s.id==='hr'):scenes[0];
 return {id:'scene-'+Date.now(),name:(brief.split(/[，,、\n]/)[0].trim().slice(0,24)||'自定义对话')+'整理',version:'1.0.0',enabled:false,draft:true,keywords:brief,trigger:'当对话以“'+brief.slice(0,130)+'”为主要目标，并有相关问答或安排时使用。结合上下文判断，不要求关键词逐字出现。',exclude:seed.exclude,text:'整理目标：'+brief+'。\n\n'+seed.text,output:seed.output,generatedBy:config.model};

async function generateScene(form){
 const brief=form.elements.brief.value.trim(),error=document.getElementById('generation-error');
 if(!brief){error.textContent='先写几个关键词，或选择一个示例。';form.elements.brief.focus();return}

 generationBusy=true;const ticket=++generationTicket,button=document.getElementById('generate-scene'),message=document.getElementById('generation-message');
 error.textContent='';button.disabled=true;button.innerHTML='<span class="spinner"></span>正在生成';form.elements.brief.disabled=true;message.textContent='模拟生成：触发条件 → 排除条件 → Prompt → 输出模板…';
 await new Promise(resolve=>setTimeout(resolve,850));
 if(ticket!==generationTicket||!document.getElementById('dialog').open||!document.getElementById('scene-brief-form'))return;
 generationBusy=false;
 if(ui.generatorFailOnce){ui.generatorFailOnce=false;button.disabled=false;button.textContent='重试生成草稿';form.elements.brief.disabled=false;message.textContent='关键词已保留，重试不会丢失输入。';error.textContent='模拟模型连接超时。可以重试，也可以手动建立场景。';announce('场景草稿生成失败，输入已保留');return}
 const draft=generatedScene(brief);scenes.push(draft);ui.scene=draft.id;ui.view='rules';document.getElementById('review-state').value='normal';closeDialog();render();toast('已生成可编辑的示例草稿，尚未启用。');announce('请检查触发条件、Prompt 和输出模板，再保存启用');
}
function sceneSave(form){

 if(missing){error.textContent='请填写'+missing[1]+'。';form.elements[missing[0]].focus();return}
 if(scenes.some(s=>s.id!==p.id&&s.name===v.name.trim())){error.textContent='已有同名场景，请换一个名称。';return}

 if(!wasDraft){const v=p.version.split('.').map(Number);p.version=[v[0],v[1]+1,0].join('.');records.filter(r=>r.scene===p.id&&r.status==='ready').forEach(r=>r.dirty=true)}

function captureCatalog(){return scenes.filter(s=>s.enabled&&!s.draft).map(snapshot)}
function resolveRouting(r){
 if(r.routeOverride){const s=r.routeCatalog.find(s=>s.id===r.routeOverride);if(s){r.scene=s.id;r.sceneSnapshot=structuredClone(s);r.routing={state:'manual',reason:'本批次已明确指定此场景。',evidence:[]};return true}}
 if(r.fixture==='mixed'){const candidates=r.routeCatalog.filter(s=>['technical','hr'].includes(s.id)).map(s=>s.id);r.routing={state:'ambiguous',reason:'预设内容同时包含技术问答与职业沟通，无法确定主要整理场景。',candidates,evidence:['s03','s04','s05']};return false}
 if(!r.fixture){r.routing={state:'unmatched',reason:'原型只读取了文件名，未读取音频或生成转写，因此没有进行真实 AI 匹配。请使用示例批次体验匹配。',candidates:[],evidence:[]};return false}
 const s=r.routeCatalog.find(s=>s.id===r.fixture);
 if(!s){r.routing={state:'unmatched',reason:'示例内容没有匹配到本批开始时已启用的场景。可选择现有场景或新建后确认。',candidates:[],evidence:['s03']};return false}
 r.scene=s.id;r.sceneSnapshot=structuredClone(s);r.routing={state:'matched',reason:r.fixture==='delivery'?'预设内容讨论改约投递时间与送前联系。':'预设内容涉及候选人问答与工程取舍。',evidence:['s03','s04']};return true;
}
function paintJobs(){if(ui.view==='library'||ui.view==='batch')render(true)}
function finishJob(r,status){clearInterval(jobTimers.get(r.id));jobTimers.delete(r.id);r.status=status;paintJobs();pumpQueue()}
function startJob(r){
 r.status='processing';const total=r.transcriptOnly?3:steps.length;
 const timer=setInterval(()=>{
  if(r.failOnce&&r.stage===4){r.failOnce=false;finishJob(r,'failed');announce('示例任务连接超时，其他录音继续');return}
  if(r.stage===3&&!r.transcriptOnly&&!resolveRouting(r)){finishJob(r,'needs_review');announce('一条录音需要确认场景，其他录音继续');return}
  r.stage++;
  if(r.stage>=total){r.dirty=false;if(r.updating){r.version++;r.updating=false}finishJob(r,'ready');announce('一条示例录音整理完成')}else paintJobs();
 },650);
 jobTimers.set(r.id,timer);paintJobs();
}
function pumpQueue(){
 while(jobTimers.size<2&&jobQueue.length){const id=jobQueue.shift(),r=records.find(r=>r.id===id);if(r?.status==='queued')startJob(r)}
}
function enqueueRecord(r,start=0){

 jobQueue=jobQueue.filter(id=>id!==r.id);r.stage=start;r.status='queued';r.routeCatalog=r.routeCatalog||captureCatalog();jobQueue.push(r.id);pumpQueue();paintJobs();
}
function cancelJob(id){const r=records.find(r=>r.id===id);if(!r)return;jobQueue=jobQueue.filter(x=>x!==id);finishJob(r,'cancelled')}

 const data=new FormData(form),error=document.getElementById('import-error');if(!importFiles.length){error.textContent='请选择多个 M4A 文件，或体验示例批次。';return}
 if(data.get('mode')==='mixed'&&config.provider!=='local'&&!data.has('consent')){error.textContent='请确认本批录音的云端匹配与整理方式，或选择仅本地处理。';document.getElementById('cloud-consent').focus();return}
 const catalog=captureCatalog();if(data.get('mode')==='mixed'&&!catalog.length){error.textContent='先创建并启用至少一个整理场景，再开始 AI 匹配。';return}
 const batchId='batch-'+Date.now(),created=importFiles.map((f,i)=>({id:'r-'+Date.now()+'-'+i,title:f.name.replace(/\.m4a$/i,''),file:f.name,date:'今天',duration:f.fixture==='delivery'?540:f.fixture==='mixed'?900:3600,scene:null,fixture:f.fixture||null,speakers:structuredClone(initialRecords[0].speakers),unresolved:f.fixture==='technical'?2:0,status:'queued',stage:0,version:1,checks:[],batchId,routeOverride:data.get('scene')==='auto'?null:data.get('scene'),routeCatalog:structuredClone(catalog),routing:null,transcriptOnly:data.get('mode')==='local'}));
 created.forEach(r=>{if(r.fixture==='delivery')r.speakers=[{name:'发言人 1',role:'courier'},{name:'发言人 2',role:'recipient'}];else if(r.fixture==='mixed')r.speakers=[{name:'发言人 1',role:'interviewer'},{name:'发言人 2',role:'candidate'}]});records.unshift(...created);document.getElementById('review-state').value='normal';ui.batchId=batchId;ui.selected=created[0].id;ui.view='batch';ui.empty=false;ui.filter='all';ui.search='';ui.evidence=null;closeDialog();created.forEach(r=>enqueueRecord(r));render();announce('示例批次已开始，每条录音独立处理');
}
function regenerateDialog(){const r=current();openDialog('按整理场景生成新版本','复用已有转写；确认后采用当前场景版本，旧结果保留。','<div class="field"><label for="regenerate-scene">整理场景</label><select class="input" name="scene" id="regenerate-scene">'+sceneOptions(r.scene)+'</select></div><div class="notice">'+icon('refresh')+'<div>原型模拟内容整理与汇总，不执行 Prompt 或真实模型请求。</div></div>','<button class="btn" type="button" data-action="close-dialog">取消</button><button class="btn primary" type="submit">开始演示整理</button>','regenerate-form')}
function showReviewState(mode){
 if(mode==='generator-error'){ui.generatorFailOnce=true;newSceneDialog('候选人，系统设计面试，关键问答与准备建议');return}
 ui.view='library';ui.filter='all';ui.search='';ui.mobileList=false;ui.empty=mode==='empty';ui.menu=false;ui.tab='summary';
 const old=records.find(r=>r.id==='demo-state');if(old){clearInterval(jobTimers.get(old.id));jobTimers.delete(old.id);jobQueue=jobQueue.filter(id=>id!==old.id);records=records.filter(r=>r.id!==old.id)}
 if(['normal','empty'].includes(mode)){ui.selected='r1';ui.evidence=matchMedia('(min-width:1060px)').matches?'s04':null;render();return}
 const r=structuredClone(initialRecords[0]);Object.assign(r,{id:'demo-state',batchId:'review-batch',title:'系统设计面试｜状态演示',file:'系统设计_示例.m4a',routeCatalog:captureCatalog(),stage:4,status:mode==='failure'?'failed':'queued',sceneSnapshot:snapshot(scenes[0])});records.unshift(r);ui.selected=r.id;ui.batchId=r.batchId;ui.evidence=null;if(mode==='processing')enqueueRecord(r,4);render();
}
function download(){const r=current(),text='# '+r.title+'\n\n> Sonafolio v2 设计稿：虚构示例，非真实录音总结。\n\n整理场景：'+sceneName(r.scene)+'\n场景版本：'+(r.sceneSnapshot?.version||'未指定')+'\n原文件名：'+r.file+'\n\n## 示例来源\n\n'+recordSources(r).map(s=>'### '+time(s.at)+'\n\n'+s.text).join('\n\n'),url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=r.title.replace(/[\\/<>:"|?*]/g,'_')+'-示例.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);closeDialog();toast('已导出虚构示例，不包含配置和密钥。')}
function reviewDialog(){openDialog('设计说明与评审范围','v2 / AI 原生主流程，尚未接入真实处理核心。','<div class="review-copy stack"><h3>一个产品对象：整理场景</h3><p>行业背景、场景类目、Prompt 和输出模板合为一个可管理的场景。默认使用 AI 匹配；用户只在意图表达、规则启用和歧义确认时介入。</p><h3>三类 AI 任务</h3><ol><li>场景生成：关键词 → 触发与排除条件、Prompt、输出模板，先保存为草稿。</li><li>自动匹配：每条完整转写 → 已启用场景，保留来源与歧义状态。</li><li>内容总结：按所选场景提取与汇总，结论可回到原文核对。</li></ol><p>这是三个任务入口，不是固定三次请求。长录音分块、批量文件和有限重试可能增加实际调用次数。</p><h3>可体验的路径</h3><p>新建场景 → 输入关键词 → 生成并编辑草稿 → 保存启用；导入 3 条示例 → 查看不同匹配结果 → 仅确认含混录音；模型 / API Key、缓存目录、录音重命名及引用核对继续保留。</p><h3>参考与边界</h3><p>参考 <a href="https://www.macwhisper.com/" target="_blank" rel="noopener noreferrer">MacWhisper</a> 的文件与模型入口、<a href="https://www.granola.ai/ai-note-taker" target="_blank" rel="noopener noreferrer">Granola</a> 的笔记使用方式、<a href="https://support.notta.ai/hc/en-us/articles/37553046929435-Edit-speaker-names" target="_blank" rel="noopener noreferrer">Notta</a> 的说话人编辑说明，结合本次用户反馈迭代。</p><p>所有生成、匹配、进度和总结均为明确标注的预设演示，不使用真实 LLM。任意本地文件只读取名称，内容未知时不会按文件名猜场景。配置仅存内存，刷新清空；不读录音内容，不移动或重命名真实文件。</p><p>真实批处理调度、场景生成接口、完整 Skill 编译／版本迁移、目录切换与桌面集成仍待开发。界面中的并发上限为演示规则，不是生产性能承诺。</p></div>')}

const baseSummary=summary;
summary=function(r){
 if(r.transcriptOnly)return '<div class="reading-inner"><div class="empty">'+icon('file')+'<h2>本地转写已完成。</h2><p>这次未请求 AI 场景匹配或总结。可先设置模型，再选择整理场景继续。</p><button class="btn primary" data-action="regenerate">选择场景并整理</button></div></div>';
 if(r.fixture==='delivery')return '<div class="reading-inner"><div class="doc-label">快递取送安排<span class="line"></span>虚构示例</div><h2 class="summary-heading">把改约的安排，留成一份备忘。</h2><p class="lede">本次示例沟通将原定下午的送件改为次日上午联系。具体投递时间未确认，保留待办而不补造承诺。</p>'+roleChips(r)+'<div class="stack"><h3>对话中明确的安排</h3><p>收件人当日下午不方便，配送人员同意次日上午再联系。 '+cite('s04')+'</p></div><div class="action-list"><label class="check"><input type="checkbox" data-check="0"><span class="check-label">次日送件前，确认实际联系时间。</span></label></div><p class="small muted">预设内容示例，不是实际模型输出。</p></div>';
 if(r.fixture==='mixed'||!r.fixture)return '<div class="reading-inner"><div class="doc-label">'+esc(sceneName(r.scene))+'<span class="line"></span>虚构结构示例</div><h2 class="summary-heading">按你确认的场景，继续整理。</h2><p class="lede">本原型只演示场景确认后的状态变化，未执行 Prompt 或真实内容生成。</p><div class="preview-pane"><h3>本次采用的输出结构</h3><pre class="output-preview">'+esc(r.sceneSnapshot?.output||'尚未指定')+'</pre></div><div class="notice">'+icon('file')+'<div>真实产品会从已保存的转写中提取并汇总，结论保留来源编号。</div></div></div>';
 return baseSummary(r);
};

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;
 switch(a){
 case'all':case'waiting':ui.view='library';ui.filter=a;ui.mobileList=true;ui.menu=false;render();break;
 case'scene-filter':ui.view='library';ui.filter=id;ui.mobileList=true;render();break;
 case'record':ui.selected=id;ui.view='library';ui.filter='all';ui.mobileList=false;ui.tab='summary';ui.evidence=null;ui.menu=false;ui.position=0;render();break;
 case'mobile-list':ui.mobileList=true;render();break;
 case'import':importDialog();break;
 case'clear-search':ui.search='';render();break;
 case'settings':switchView('settings');break;
 case'rules':switchView('rules');break;
 case'batch':switchView('batch');break;
 case'settings-tab':ui.settingsTab=id;render();break;
 case'theme':{const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dark?'light':'dark';toast(dark?'已切换浅色外观。':'已切换深色外观。');break}
 case'menu':ui.menu=!ui.menu;render(true);break;
 case'rename':renameDialog();break;
 case'classify':classifyDialog();break;
 case'speakers':speakersDialog();break;
 case'tab':ui.tab=id;render();break;
 case'cite':case'seek':{const s=recordSources(current()).find(s=>s.id===id);if(s){ui.position=s.at;ui.evidence=id;render(true);announce('原文已定位到 '+time(s.at))}break}
 case'close-evidence':ui.evidence=null;render(true);break;
 case'play':ui.playing=!ui.playing;if(ui.playing){toast('仅演示时间轴移动，没有音频播放。');clearInterval(playTimer);playTimer=setInterval(()=>{const r=current();ui.position=Math.min(ui.position+ui.speed,r.duration);const range=document.getElementById('seek-range'),pos=document.getElementById('play-position');if(range)range.value=ui.position;if(pos)pos.textContent=time(ui.position);if(ui.position>=r.duration){clearInterval(playTimer);ui.playing=false;if(ui.view==='library')render(true)}},1000)}else clearInterval(playTimer);render(true);break;
 case'speed':ui.speed=ui.speed===1?1.5:ui.speed===1.5?2:1;render(true);break;
 case'open-template':ui.scene=current().scene||scenes[0].id;switchView('rules');break;
 case'scene':ui.scene=id;render();break;
 case'scene-preview':previewScene();break;
 case'new-scene':newSceneDialog();break;
 case'new-scene-from-record':newSceneDialog('对话目标、参与者、需要保留的问答与后续安排');break;
 case'refine-scene':{const s=drafts[id]||scenes.find(s=>s.id===id);newSceneDialog(s.keywords||s.name);break}
 case'brief-example':{const s=scenes.find(s=>s.id===id),field=document.getElementById('scene-brief');field.value=s.keywords;field.focus();break}
 case'blank-scene':{if(generationBusy)return;const draft={id:'scene-'+Date.now(),name:'',version:'1.0.0',enabled:false,draft:true,keywords:document.getElementById('scene-brief').value.trim(),trigger:'',exclude:'',text:'',output:'## 沟通概览\n## 关键内容与来源\n## 后续行动\n## 待确认事项'};scenes.push(draft);ui.scene=draft.id;ui.view='rules';closeDialog();render();break}
 case'discard-scene':{const at=scenes.findIndex(s=>s.id===id&&s.draft);if(at>=0){scenes.splice(at,1);delete drafts[id];ui.scene=scenes[0].id;render();toast('已放弃未启用草稿。')}break}
 case'toggle-scene':{const s=scenes.find(s=>s.id===id);s.enabled=!s.enabled;render(true);toast(s.enabled?'场景已启用。':'场景已停用，新批次不再自动匹配；旧结果和运行中快照保留。');break}
 case'confirm-scene':confirmScene(records.find(r=>r.id===b.dataset.record),id);break;
 case'reveal-key':{const input=document.getElementById('api-key'),show=input.type==='password';input.type=show?'text':'password';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',show?'隐藏 API Key':'显示 API Key');break}
 case'test-model':testConnection();break;
 case'apply-storage':Object.assign(config,pendingStorage);pendingStorage=null;closeDialog();render();toast('已应用演示路径，没有创建目录或移动文件。');break;
 case'close-dialog':closeDialog();break;
 case'use-demo':selectImportFiles([{name:'系统设计面试_示例.m4a',fixture:'technical'},{name:'配送沟通_示例.m4a',fixture:'delivery'},{name:'混合对话_示例.m4a',fixture:'mixed'}]);break;
 case'review':reviewDialog();break;
 case'export':exportDialog();break;
 case'download':download();break;
 case'regenerate':regenerateDialog();break;
 case'cancel-job':cancelJob(id||current().id);break;
 case'resume':{const r=records.find(r=>r.id===id)||current();enqueueRecord(r,r.stage||0);break}
 case'cancel-batch':{const list=records.filter(r=>(!ui.batchId||r.batchId===ui.batchId)&&['processing','queued'].includes(r.status));list.forEach(r=>{clearInterval(jobTimers.get(r.id));jobTimers.delete(r.id);r.status='cancelled';jobQueue=jobQueue.filter(id=>id!==r.id)});pumpQueue();render();toast('已取消本批未完成任务，已整理结果保留。');break}
 }
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;
 switch(f.getAttribute('id')){
 case'model-form':modelSave(f);break;
 case'storage-form':storagePreview(f);break;
 case'scene-brief-form':generateScene(f);break;
 case'scene-form':sceneSave(f);break;
 case'rename-form':renameSave(f);break;
 case'import-form':importSave(f);break;
 case'speakers-form':saveSpeakers(f);break;
 case'route-form':confirmScene(current(),new FormData(f).get('scene'));break;
 case'classify-form':{const r=current(),id=new FormData(f).get('scene'),s=scenes.find(s=>s.id===id);if(r.status==='needs_review'){closeDialog();confirmScene(r,id);break}r.scene=id;r.sceneSnapshot=snapshot(s);r.routeOverride=id;r.routing={state:'manual',reason:'已手动更正整理场景。',evidence:[]};r.dirty=true;closeDialog();render(true);toast('场景已更新，可按新规则重新整理。');break}
 case'regenerate-form':{const r=current(),id=new FormData(f).get('scene'),s=scenes.find(s=>s.id===id);r.scene=id;r.sceneSnapshot=snapshot(s);r.routing={state:'manual',reason:'按你指定的场景版本重新整理。',evidence:[]};r.transcriptOnly=false;r.updating=true;closeDialog();enqueueRecord(r,4);break}
 }
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='record-search'){ui.search=el.value;document.getElementById('records').innerHTML=recordRows();document.getElementById('result-count').textContent=filtered().length+' 条'}
 if(el.id==='seek-range'){ui.position=Number(el.value);document.getElementById('play-position').textContent=time(ui.position)}
 if(el.closest('#scene-form')){drafts[ui.scene]=Object.fromEntries(new FormData(document.getElementById('scene-form')));document.getElementById('scene-dirty').textContent='有未保存修改'}
 if(['workspace-path','models-path','cache-path'].includes(el.id)){const f=document.getElementById('storage-form');document.getElementById('models-preview').textContent=joined(f.workspace.value,f.models.value);document.getElementById('cache-preview').textContent=joined(f.workspace.value,f.cache.value)}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.id==='review-state')showReviewState(el.value);
 if(el.id==='library-filter'){ui.filter=el.value;render()}
 if(el.id==='speaker-filter'){ui.transcriptSpeaker=el.value;render(true)}
 if(el.dataset.check!==undefined){const r=current(),n=Number(el.dataset.check);r.checks=el.checked?[...new Set([...r.checks,n])]:r.checks.filter(x=>x!==n)}
 if(el.id==='rename-file-toggle')document.getElementById('rename-file').disabled=!el.checked;
 if(el.id==='import-file'&&el.files.length)selectImportFiles(Array.from(el.files).map(f=>({name:f.name})));
 if(el.id==='import-mode'){const local=el.value==='local';document.getElementById('cloud-disclosure').hidden=local;document.getElementById('cloud-consent-label').hidden=local||config.provider==='local';document.getElementById('import-scene').disabled=local}
 if(el.id==='provider'){const f=document.getElementById('model-form');f.endpoint.value=el.value==='deepseek'?'https://api.deepseek.com':el.value==='local'?'http://localhost:11434/v1':'https://api.example.com/v1';f.model.value=el.value==='deepseek'?'deepseek-flash':el.value==='local'?'your-local-model':'your-model';document.getElementById('key-optional').textContent=el.value==='local'?'（本地服务可留空）':'';document.getElementById('model-message').textContent='配置已调整，请重新检查连接。'}
 if(el.id==='platform'){const f=document.getElementById('storage-form');f.workspace.value=el.value==='windows'?'D:\\Sonafolio':'/Users/you/Sonafolio';f.workspace.dispatchEvent(new Event('input',{bubbles:true}))}
});
render();

</script>
