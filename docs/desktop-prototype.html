function listPanel(){return '<section class="record-list" aria-label="录音库"><div class="list-top"><div class="row spread"><h2>'+({all:'我的声笺',waiting:'待核对录音',interview:'面试记录',consultation:'问诊记录',delivery:'快递记录'}[ui.filter]||'我的声笺')+'</h2><span id="result-count" class="small muted">'+filtered().length+' 条</span></div><label class="search">'+icon('search')+'<span class="sr-only">搜索录音标题、文件名或分类</span><input id="record-search" placeholder="搜索录音、文件名…" value="'+esc(ui.search)+'" autocomplete="off"></label><div class="list-controls"><span>按导入时间排列</span><select id="library-filter" aria-label="录音类目筛选">'+option('all','全部场景',ui.filter)+option('waiting','待核对',ui.filter)+option('interview','面试',ui.filter)+option('consultation','问诊',ui.filter)+option('delivery','快递',ui.filter)+'</select></div></div><div class="records" id="records">'+recordRows()+'</div><div class="list-foot">虚构录音，仅用于界面评审</div></section>'}

function header(r){const ready=r.status==='ready';return '<header class="main-header"><div class="row spread"><div class="breadcrumb"><button class="mobile-list-button" data-action="mobile-list">'+icon('back')+'录音库</button><span>'+esc(industryName(r.industry))+'</span>'+icon('chevron')+'<button data-action="classify" class="template-link">'+esc(catName(r.category))+'</button></div><span class="pill '+(ready?'ok':r.status==='failed'?'fail':'blue')+'">'+(ready?(r.transcriptOnly?'已转写':'已整理'):r.status==='failed'?'需要重试':r.status==='cancelled'?'已取消':'处理中')+'</span></div><div class="title-row"><h1>'+esc(r.title)+'</h1><div class="tools"><button class="btn" data-action="export" '+(!ready?'disabled title="整理完成后可导出"':'')+'>'+icon('export')+'<span class="export-label">导出</span></button><div class="menu-wrap"><button class="icon-btn" data-action="menu" aria-label="录音操作" aria-expanded="'+ui.menu+'">'+icon('more')+'</button>'+(ui.menu?'<div class="menu" role="group" aria-label="录音操作"><button data-action="rename">'+icon('edit')+'重命名</button><button data-action="classify">'+icon('folder')+'修改分类</button><button data-action="regenerate" '+(!ready?'disabled':'')+'>'+icon('refresh')+'重新整理</button></div>':'')+'</div></div></div><div class="file-meta"><span>'+icon('file')+esc(r.file)+'</span><span>'+icon('clock')+time(r.duration)+'</span><span>'+icon('people')+r.speakers.length+' 位说话人</span></div>'+(r.dirty?'<div class="notice warn">'+icon('warning')+'<div>角色或模板已调整。已有总结保留，重新整理后生成新版本。 <button class="link-btn" data-action="regenerate">重新整理</button></div></div>':'')+(ready?'<div class="tabs-line"><div class="tabs" role="tablist" aria-label="录音内容">'+[['summary','复盘总结'],['transcript','逐字稿'],['review','待核对']].map(([id,name])=>'<button role="tab" aria-selected="'+(ui.tab===id)+'" class="tab '+(ui.tab===id?'active':'')+'" data-action="tab" data-id="'+id+'">'+name+(id==='review'&&r.unresolved?'<span class="number">'+r.unresolved+'</span>':'')+'</button>').join('')+'</div><button class="template-link" data-action="open-template">'+icon('rules')+'模板 '+esc(prompts.find(p=>p.id===r.template)?.version||'1.0.0')+'</button></div>':'')+'</header>'}
function cite(id){const s=sources.find(x=>x.id===id);return '<button class="cite '+(ui.evidence===id?'selected':'')+'" data-action="cite" data-id="'+id+'" aria-label="查看 '+time(s.at)+' 的原文">'+icon('link')+time(s.at)+'</button>'}
function roleChips(r){return '<div class="speakers" aria-label="根据内容推断的角色">'+r.speakers.map((p,i)=>'<button class="speaker" data-action="speakers"><b>'+String(i+1).padStart(2,'0')+'</b>'+esc(roles[p.role])+'</button>').join('')+'</div>'}
function summary(r){if(r.category==='consultation')return '<div class="reading-inner"><div class="doc-label">问诊信息整理<span class="line"></span>示例内容</div><h2 class="summary-heading">把沟通中的安排，留成一份备忘。</h2><p class="lede">此虚构示例仅展示问诊类目的内容组织，不提供诊断或治疗建议。正式结果将区分对话事实、医嘱来源与待确认事项。</p>'+roleChips(r)+'<div class="stack"><h3>沟通要点</h3><p class="lede">按时间线整理本次沟通中提及的情况，重要信息回到录音原文核对。</p></div><div class="stack"><h3>后续安排</h3><label class="check"><input type="checkbox" data-check="0"><span class="check-label">回听确认对话中提及的复诊时间。</span></label></div><div class="notice">'+icon('shield')+'<div>原型未附问诊音频和诊疗内容。点击右上角可重命名或更换分类。</div></div></div>';
const technical=r.category!=='hr';return '<div class="reading-inner"><div class="doc-label">候选人视角<span class="line"></span>复盘版本 '+r.version+'</div><h2 class="summary-heading">'+(technical?'从项目经历，聊到系统背后的取舍。':'从职业选择，聊到如何与团队协作。')+'</h2><p class="lede">'+(technical?'本次对话围绕消息处理、异步架构与工程实践展开。你说明了方案的基本思路；下一次可以补充关键边界，以及支撑决策的具体场景。':'本次对话围绕求职动机、协作经历与岗位预期展开。建议把具体情境、自己的行动和结果连起来讲，并核对尚未明确的后续安排。')+'</p>'+roleChips(r)+'<section class="stack"><div class="section-head"><h3>关键问答</h3><span>事实与建议分开呈现</span></div><details class="qa" open><summary>'+(technical?'消息重复消费，你是怎么处理的？':'如何讲述一次有分歧的协作经历？')+icon('down')+'</summary><div class="qa-answer"><div><span class="answer-label">你的回答</span><p>'+(technical?'以事件 ID 做幂等，已成功处理的消息直接返回；失败消息进入重试队列。':'先说明共同目标，再描述分歧和沟通过程，最后交代实际结果。')+' '+(technical?cite('s04'):'<span class="pill">虚构结构示例</span>')+'</p></div><div class="advice">准备建议：'+(technical?'补充幂等记录的生命周期，并说明确认失败与业务成功之间的恢复方式。':'准备一个具体案例，区分团队行动和自己的贡献。')+'</div></div></details><details class="qa"><summary>'+(technical?'为什么引入异步，而不是全部同步完成？':'你期待怎样的团队与工作方式？')+icon('down')+'</summary><div class="qa-answer"><p>'+(technical?'关键交易保留同步，非关键路径异步化；允许短暂延迟，同时需要补偿和监控。 '+cite('s08'):'把个人偏好与岗位实际需求对应，不补造对方没有提供的信息。')+'</p><div class="advice">准备建议：用一个完整场景说明选择的收益与代价。</div></div></details></section><section class="stack"><div class="section-head"><h3>下一次，带上这些准备</h3><span>手动勾选完成</span></div><div class="action-list">'+(technical?['画一张消息处理时序图，覆盖重复与重试。','补充一个体现架构取舍的具体项目案例。','回听待核对片段，确认术语和说话人。']:['整理一个完整的团队协作案例。','列出需要向招聘方确认的岗位问题。','核对对话中提及的后续时间安排。']).map((t,i)=>'<label class="check"><input type="checkbox" data-check="'+i+'" '+(r.checks.includes(i)?'checked':'')+'><span class="check-label">'+t+'</span></label>').join('')+'</div></section>'+(r.unresolved?'<div class="notice warn">'+icon('warning')+'<div><strong>还有 '+r.unresolved+' 处需要回听</strong><br>一处说话人归属不明，一处术语待核对。 <button class="link-btn" data-action="tab" data-id="review">查看待核对内容</button></div></div>':'')+'<p class="small muted">模型整理草稿。建议与原文一起阅读，不将转写误识视为个人能力问题。</p></div>'}
function transcript(r){return '<div class="reading-inner"><div class="segment-filter"><label for="speaker-filter">筛选说话人</label><select id="speaker-filter">'+option('all','全部说话人',ui.transcriptSpeaker)+r.speakers.map((p,i)=>option(String(i),p.name+' / '+roles[p.role],ui.transcriptSpeaker)).join('')+option('unknown','归属待确认',ui.transcriptSpeaker)+'</select><span>片段时间示例</span></div><div class="transcript-list">'+recordSources(r).filter(s=>ui.transcriptSpeaker==='all'||ui.transcriptSpeaker===(s.speaker===null?'unknown':String(s.speaker))).map(s=>'<section class="transcript-block '+(ui.evidence===s.id?'active':'')+'"><div class="who"><button class="link-btn" data-action="speakers">'+(s.speaker===null?'说话人待确认':esc(r.speakers[s.speaker]?.name||'发言人')+' / '+esc(roles[r.speakers[s.speaker]?.role||'unknown']))+'</button><button class="cite" data-action="cite" data-id="'+s.id+'">'+time(s.at)+'</button></div><p>'+esc(s.text)+'</p></section>').join('')+'</div><div class="notice">'+icon('file')+'<div>原型用少量虚构片段演示检索与引用；未加载完整音频或真实转写。</div></div></div>'}
function reviewContent(r){return '<div class="reading-inner"><div class="stack"><h2>保留不确定，再回到原话。</h2><p class="lede">未可靠归属的内容不会强行算作某个人的回答。</p></div>'+(r.unresolved?'<div class="notice warn">'+icon('warning')+'<div><strong>说话人归属待确认</strong><br>18:42 后的接话可能包含多人声音。 '+cite('s05')+'</div></div><div class="notice warn">'+icon('warning')+'<div><strong>技术术语待核对</strong><br>对齐结果保留原始识别文字，需回听确认。 '+cite('s06')+'</div></div><button class="btn" data-action="speakers">'+icon('people')+'更正参与者角色</button>':'<div class="notice ok">'+icon('check')+'<div>当前示例没有单独标记的待核对项。模型未标记不代表内容已经人工确认。</div></div>')+'<p class="small muted">这里是后续功能的交互示意，尚未连接真实人工校正流程。</p></div>'}
function evidence(r){if(!ui.evidence)return'';const list=recordSources(r),focus=list.find(s=>s.id===ui.evidence)||list[1];const index=list.indexOf(focus),near=list.slice(Math.max(0,index-1),Math.min(list.length,index+2));return '<aside class="evidence" aria-label="原文核对"><div class="evidence-head"><h3>原文核对</h3><button class="icon-btn" data-action="close-evidence" aria-label="关闭原文核对">'+icon('close')+'</button></div><div class="evidence-context">引用 '+time(focus.at)+'，保留前后文</div><div class="evidence-transcript">'+near.map(s=>'<section class="utterance '+(s.id===focus.id?'active':'')+'"><div class="who"><strong>'+(s.speaker===null?'归属待确认':esc(roles[r.speakers[s.speaker]?.role||'unknown']))+'</strong><button class="cite" data-action="seek" data-id="'+s.id+'">'+time(s.at)+'</button></div><div class="quote">'+esc(s.text)+'</div></section>').join('')+'</div><div class="evidence-foot"><button class="link-btn" data-action="tab" data-id="transcript">查看逐字稿上下文</button><p>角色来自内容推断，可能有误。原型使用虚构文字，时间轴仅演示定位。</p></div></aside>'}
function player(r){return '<footer class="player"><button class="play" data-action="play" aria-label="'+(ui.playing?'暂停时间轴演示':'开始时间轴演示，无音频')+'">'+icon(ui.playing?'pause':'play')+'</button><span class="time" id="play-position">'+time(ui.position)+'</span><div class="wave" aria-hidden="true">'+[5,11,8,16,10,6,13,17,8,12,5,10].map(h=>'<i style="height:'+h+'px"></i>').join('')+'</div><label class="sr-only" for="seek-range">示例录音时间位置</label><input type="range" min="0" max="'+r.duration+'" value="'+Math.min(ui.position,r.duration)+'" id="seek-range"><span class="time">'+time(r.duration)+'</span><button class="speed" data-action="speed" aria-label="时间轴演示速度">'+ui.speed.toFixed(1)+'×</button><span class="player-caption">时间轴演示，无音频</span></footer>'}
const steps=['读取录音','转写与说话人区分','对齐说话内容','判断行业与场景','按 Prompt 整理','汇总与归档'];
function processing(r){const stage=r.stage||0;return '<div class="progress-section"><span class="pill blue">离线交互演示</span><h2>'+(r.status==='failed'?'转写已保留，总结稍后继续。':r.status==='cancelled'?'任务已暂停在这里。':'把这段声音，整理成一份声笺。')+'</h2><p class="muted small">'+(r.status==='failed'?'模拟 DeepSeek 连接超时。修复连接后，从总结阶段继续。':r.status==='cancelled'?'继续时复用已经完成的演示阶段。':'进度与耗时均为模拟，不执行模型或网络请求。')+'</p><div class="steps">'+steps.map((s,i)=>'<div class="step '+(i<stage?'done':i===stage?'current':'')+'"><span class="step-state">'+(i<stage?icon('check'):i+1)+'</span><span>'+s+'</span><span class="suffix">'+(i<stage?'已完成':i===stage?(r.status==='processing'?'处理中':r.status==='failed'?'连接超时':'已取消'):'等待')+'</span></div>').join('')+'</div>'+(r.status==='failed'?'<div class="notice error">'+icon('warning')+'<div>示例错误：总结服务暂时不可用。原始录音与转写不受影响。</div></div>':'')+'<div class="row wrap" style="margin-top:20px">'+(r.status==='processing'?'<button class="btn" data-action="cancel-job">取消任务</button>':'<button class="btn primary" data-action="resume">'+icon('refresh')+'从这里继续</button><button class="btn" data-action="settings">检查模型设置</button>')+'</div></div>'}
function detail(){const r=current();if(ui.empty||!r||!filtered().some(x=>x.id===r.id))return '<main class="main"><button class="mobile-list-button" data-action="mobile-list" style="padding:20px">'+icon('back')+'录音库</button><div class="empty">'+icon('file')+'<h2>让声音，落在纸上。</h2><p>选择一条录音，或导入新的对话。总结、原文与后续行动会整理在这里。</p><button class="btn primary" data-action="import">'+icon('plus')+'导入录音</button></div></main>';return '<main class="main '+(ui.evidence&&r.status==='ready'&&r.category!=='consultation'?'has-evidence':'')+'">'+header(r)+(r.status==='ready'?'<div class="detail-body"><article class="reading" tabindex="-1" aria-label="'+(ui.tab==='summary'?'复盘总结':ui.tab==='transcript'?'逐字稿':'待核对内容')+'">'+(ui.tab==='summary'?summary(r):ui.tab==='transcript'?transcript(r):reviewContent(r))+'</article>'+(r.category!=='consultation'?evidence(r):'')+'</div>'+player(r):'<div class="detail-body">'+processing(r)+'</div>')+'</main>'}
function render(preserve=false){const scroll=preserve?document.querySelector('.reading')?.scrollTop:0;const app=document.getElementById('app');app.className='app'+(ui.mobileList?' show-list':'');app.innerHTML=sidebar()+(ui.view==='library'?listPanel()+detail():ui.view==='settings'?settingsPage():rulesPage());if(preserve&&scroll)document.querySelector('.reading')?.scrollTo(0,scroll)}
function settingsPage(){return '<main class="view-full"><header class="page-head"><div><div class="breadcrumb">工作区偏好</div><h1 style="margin-top:7px">设置</h1><p>连接模型，决定文件与缓存保存在什么地方。</p></div><button class="icon-btn" data-action="theme" aria-label="切换明暗主题">'+icon('sun')+'</button></header><div class="page-content"><div class="tabs-line"><div class="tabs" role="tablist" aria-label="设置分类">'+[['models','模型与 API'],['storage','存储位置']].map(([id,label])=>'<button class="tab '+(ui.settingsTab===id?'active':'')+'" role="tab" aria-selected="'+(ui.settingsTab===id)+'" data-action="settings-tab" data-id="'+id+'">'+label+'</button>').join('')+'</div><span class="small muted">配置演示，仅当前页面有效</span></div>'+(ui.settingsTab==='models'?modelSettings():storageSettings())+'</div></main>'}
function modelSettings(){return '<div class="setting-grid"><form id="model-form" class="stack" novalidate><section class="form-section"><div class="row spread"><h2>内容整理模型</h2><span class="pill blue">云端 / 本地可配置</span></div><div class="notice">'+icon('key')+'<div>请勿输入真实密钥。使用 <strong class="mono">demo-key</strong> 演示连接成功，其他值演示认证失败。此页不发起网络请求。</div></div><div class="field-grid"><div class="field"><label for="provider">服务商</label><select class="input" id="provider" name="provider">'+option('deepseek','DeepSeek',config.provider)+option('compatible','兼容 OpenAI 的服务',config.provider)+option('local','本地模型服务',config.provider)+'</select></div><div class="field"><label for="model">模型名称</label><input class="input" id="model" name="model" value="'+esc(config.model)+'" placeholder="例如 deepseek-flash" required></div></div><div class="field"><label for="endpoint">API 地址</label><input class="input" id="endpoint" name="endpoint" type="url" value="'+esc(config.endpoint)+'" placeholder="https://api.example.com" required><span class="help">用于整理转写文字；ASR 与说话人区分继续在本地运行。</span></div><div class="field"><label for="api-key">API Key <span id="key-optional" class="muted small">'+(config.provider==='local'?'（本地服务可留空）':'')+'</span></label><div class="input-row"><input class="input mono" id="api-key" name="apiKey" type="password" autocomplete="off" spellcheck="false" value="'+esc(config.apiKey)+'" placeholder="仅输入演示值 demo-key"><button class="btn" type="button" data-action="reveal-key" aria-label="显示 API Key" aria-pressed="false">'+icon('eye')+'</button></div><span class="help">原型仅存于内存，刷新清空。正式版由本地处理进程保存，前端不回传已保存的密钥。</span></div><div class="row wrap"><button class="btn" id="test-model" type="button" data-action="test-model">检查连接</button><span id="model-message" role="status" class="small muted">尚未检查演示连接</span></div><p class="field-error" id="model-error" role="alert"></p></section><div class="form-actions"><span class="small muted">兼容接口与本地模型属于设计范围，尚未接入核心。</span><button class="btn primary" type="submit" function beginProgress(r,start=0){clearInterval(progressTimer);r.status='processing';r.stage=start;ui.selected=r.id;ui.view='library';ui.empty=false;ui.mobileList=false;ui.tab='summary';ui.evidence=null;render();announce('开始模拟处理');progressTimer=setInterval(()=>{r.stage++;const total=r.transcriptOnly?3:steps.length;if(r.stage>=total){clearInterval(progressTimer);r.status='ready';r.dirty=false;if(r.updating){r.version++;r.updating=false}render(true);toast(r.transcriptOnly?'示例转写已完成，未生成模型总结。':'示例整理完成。没有执行模型或联网请求。');announce('模拟整理已完成')}else{if(ui.view==='library'&&ui.selected===r.id)render(true);announce('演示阶段：'+steps[r.stage])}},1100)}
function showReviewState(mode){clearInterval(progressTimer);ui.empty=mode==='empty';ui.view='library';ui.filter='all';ui.search='';ui.mobileList=false;ui.tab='summary';ui.menu=false;let r=records.find(x=>x.id==='demo-state');records=records.filter(x=>x.id!=='demo-state');if(mode==='normal'||mode==='empty'){ui.selected='r1';ui.evidence='s04';render();return}r=structuredClone(initialRecords[0]);Object.assign(r,{id:'demo-state',title:'系统设计面试｜整理中',file:'系统设计_演示.m4a',date:'今天',stage:mode==='failure'?4:1,status:mode==='failure'?'failed':'processing'});records.unshift(r);ui.selected=r.id;ui.evidence=null;if(mode==='processing')beginProgress(r,1);else render()}
function validateModel(form){const d=new FormData(form),values=Object.fromEntries(d);if(!String(values.model||'').trim())return{error:'请填写模型名称。'};let url;try{url=new URL(values.endpoint)}catch{return{error:'请填写有效的 API 地址。'}}if(!['http:','https:'].includes(url.protocol))return{error:'API 地址需要以 https:// 或 http:// 开头。'};if(url.protocol!=='https:'&&!['localhost','127.0.0.1','[::1]'].includes(url.hostname))return{error:'云端 API 请使用 HTTPS；HTTP 仅用于本地服务。'};if(values.provider!=='local'&&!String(values.apiKey||'').trim())return{error:'请填写演示密钥 demo-key；请勿使用真实密钥。'};return{values:{provider:values.provider,endpoint:values.endpoint.trim(),model:values.model.trim(),apiKey:values.apiKey.trim()}}}
async function testConnection(){const form=document.getElementById('model-form'),result=validateModel(form),message=document.getElementById('model-message');document.getElementById('model-error').textContent=result.error||'';if(result.error){form.querySelector(!form.model.value.trim()?'#model':'#endpoint').focus();return}const btn=document.getElementById('test-model');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>检查中';message.textContent='模拟连接中，不发送网络请求…';await new Promise(r=>setTimeout(r,800));if(!btn.isConnected)return;btn.disabled=false;btn.textContent='检查连接';const success=result.values.provider==='local'||result.values.apiKey==='demo-key';message.textContent=success?'演示：连接通过，JSON 返回有效。':'演示：认证失败。请用 demo-key 重试。';message.style.color=success?'var(--success)':'var(--danger)';config.connection=success?'passed':'failed';announce(message.textContent)}
function modelSave(form){const result=validateModel(form);document.getElementById('model-error').textContent=result.error||'';if(result.error)return;Object.assign(config,result.values);toast('演示模型配置已保存到页面内存，刷新即清空。');document.getElementById('model-message').textContent='已保存当前演示配置';document.getElementById('model-message').style.color='var(--muted)'}
function validateStorage(form){const v=Object.fromEntries(new FormData(form));for(const key of ['workspace','models','cache'])v[key]=v[key].trim();if(!v.workspace||!(v.platform==='windows'?/^[A-Za-z]:[\\/]/.test(v.workspace):v.workspace.startsWith('/')))return{error:v.platform==='windows'?'Windows 工作区请使用绝对路径，例如 D:\\Sonafolio。':'macOS 工作区请使用绝对路径，例如 /Users/you/Sonafolio。'};if(v.workspace.split(/[\\/]/).includes('..'))return{error:'工作区路径不能包含上级目录跳转。'};for(const key of ['models','cache']){const path=v[key],parts=path.split(/[\\/]/);if(!path||/^[\\/]|^[A-Za-z]:/.test(path)||parts.includes('..')||/[<>:"|?*]/.test(path))return{error:'模型和缓存目录请使用工作区内的相对路径，不能包含 .. 或非法字符。'};if(['data','.runtime','.venv','.git'].includes(parts[0]))return{error:'模型和缓存不能占用录音、密钥、依赖或 Git 目录。'}}if(v.models===v.cache)return{error:'请分别设置模型文件目录与下载缓存目录。'};return{values:v}}
let pendingStorage=null;
function storagePreview(form){const result=validateStorage(form);document.getElementById('storage-error').textContent=result.error||'';if(result.error)return;pendingStorage=result.values;openDialog('应用新的存储位置','原型只更新演示配置，不创建目录或移动任何文件。','<div class="field"><span class="field-label">工作区</span><span class="path">'+esc(pendingStorage.workspace)+'</span></div><div class="field"><span class="field-label">模型文件</span><span class="path">'+esc(joined(pendingStorage.workspace,pendingStorage.models))+'</span></div><div class="field"><span class="field-label">模型下载与运行缓存</span><span class="path">'+esc(joined(pendingStorage.workspace,pendingStorage.cache))+'</span></div><div class="notice warn">'+icon('warning')+'<div>正式版中新任务使用新配置；已有文件保持原位。迁移已有录音和模型需要单独校验，不能只替换路径字符串。</div></div>','<button class="btn" type="button" data-action="close-dialog">返回修改</button><button class="btn primary" type="button" data-action="apply-storage">应用演示配置</button>')}
function renameSave(form){const r=current(),d=new FormData(form),title=String(d.get('title')||'').trim(),file=String(d.get('file')||'').trim(),sync=d.has('renameFile');let error='';if(!title)error='请填写录音标题。';else if(sync&&(!file||/[\\/<>:"|?*\x00-\x1f]/.test(file)))error='文件名不能包含路径分隔符或非法字符。';else if(sync&&!/\.m4a$/i.test(file))error='请保留原始 .m4a 扩展名。';else if(sync&&records.some(x=>x.id!==r.id&&x.file.toLowerCase()===file.toLowerCase()))error='已有同名录音文件，请换一个文件名。';document.getElementById('rename-error').textContent=error;if(error)return;r.title=title;if(sync)r.file=file;closeDialog();render(true);toast(sync?'已更新示例标题与文件名，未修改真实文件。':'已更新录音标题，原始文件名保持不变。')}
function promptSave(form){const p=prompts.find(x=>x.id===ui.template),d=Object.fromEntries(new FormData(form));let error='';if(!d.name.trim())error='请填写模板名称。';else if(!d.text.trim())error='请填写整理指令。';else if(prompts.some(x=>x.id!==p.id&&x.name===d.name.trim()))error='已有同名模板，请换一个名称。';document.getElementById('prompt-error').textContent=error;if(error)return;Object.assign(p,{name:d.name.trim(),text:d.text.trim(),industry:d.industry,category:d.category});const v=p.version.split('.').map(Number);p.version=[v[0],v[1]+1,0].join('.');delete drafts[p.id];records.filter(r=>r.template===p.id).forEach(r=>r.dirty=true);render(true);toast('模板已保存为 '+p.version+'。已有总结未覆盖。')}
function newPromptSave(form){const d=Object.fromEntries(new FormData(form)),name=d.name.trim();const e=document.getElementById('new-prompt-error');if(!name){e.textContent='请填写模板名称。';return}if(prompts.some(p=>p.name===name)){e.textContent='已有同名模板，请使用不同名称。';return}const base=prompts.find(p=>p.category===d.category)||prompts[0],id='custom-'+Date.now();prompts.push({id,name,category:d.category,industry:d.industry,version:'1.0.0',base:catName(d.category),enabled:true,text:base.text});ui.template=id;ui.view='rules';ui.rulesTab='prompts';closeDialog();render();toast('已创建演示模板，可继续编辑整理指令。')}
function categorySave(form){const d=Object.fromEntries(new FormData(form)),list=d.kind==='industry'?industries:categories,name=d.name.trim(),error=document.getElementById('category-error');if(!name){error.textContent='请填写名称。';return}if(list.some(x=>x.id!==d.id&&x.name===name)){error.textContent='同一维度已有此名称，请使用不同名称。';return}const c=list.find(x=>x.id===d.id),data={name,enabled:!!d.enabled};if(d.kind==='scene')data.parent=d.parent;if(c)Object.assign(c,data);else list.push({id:'custom-'+Date.now(),...data});closeDialog();render();toast('演示分类已保存，历史录音继续保留原分类。')}
function importSave(form){const d=new FormData(form),error=document.getElementById('import-error');if(!importFile){error.textContent='请先选择 M4A 文件，或使用示例录音。';return}if(d.get('mode')==='mixed'&&!d.has('consent')){error.textContent='请确认本条录音的云端整理方式，或选择仅本地转写。';document.getElementById('cloud-consent').focus();return}const r=structuredClone(initialRecords[0]);Object.assign(r,{id:'r'+Date.now(),title:importFile.name.replace(/\.m4a$/i,''),file:importFile.name,date:'今天',category:d.get('category')==='auto'?'technical':d.get('category'),industry:d.get('industry'),transcriptOnly:d.get('mode')==='local',unresolved:2,checks:[],status:'processing',version:1});r.template=prompts.find(p=>p.category===r.category&&p.enabled)?.id||'technical';records.unshift(r);ui.filter='all';ui.search='';document.getElementById('review-state').value='normal';closeDialog();beginProgress(r)}
function saveSpeakers(form){const r=current(),d=new FormData(form);for(let i=0;i<r.speakers.length;i++)if(!String(d.get('name'+i)||'').trim()){document.getElementById('speaker-error').textContent='每位参与者都需要名称，也可以保留默认编号。';return}r.speakers=r.speakers.map((p,i)=>({name:String(d.get('name'+i)).trim(),role:d.get('role'+i)}));r.dirty=true;closeDialog();render(true);toast('示例角色已更新，重新整理后用于新的总结。')}
function download(){const r=current(),text='# '+r.title+'\n\n> Sonafolio 设计稿导出：虚构示例，非真实录音总结。\n\n行业：'+industryName(r.industry)+'\n场景：'+catName(r.category)+'\n原始文件名：'+r.file+'\n\n## 沟通要点\n\n围绕具体案例整理问答、方案选择与后续准备。\n\n## 行动\n\n- [ ] 准备一个完整案例\n- [ ] 核对待确认片段\n\n## 示例来源\n\n'+recordSources(r).map(s=>'### '+time(s.at)+'\n\n'+s.text).join('\n\n');const blob=new Blob([text],{type:'text/markdown;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=r.title.replace(/[\\/<>:"|?*]/g,'_')+'-示例.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);closeDialog();toast('已导出虚构示例 Markdown。')}
function switchView(view){ui.view=view;ui.mobileList=false;ui.menu=false;render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;switch(a){case'all':case'waiting':ui.view='library';ui.filter=a;ui.mobileList=true;ui.menu=false;render();break;case'scene-interview':case'scene-consultation':case'scene-delivery':ui.view='library';ui.filter=a.slice(6);ui.mobileList=true;render();break;case'record':ui.selected=id;ui.mobileList=false;ui.tab='summary';ui.menu=false;ui.evidence=null;ui.position=0;render();break;case'mobile-list':ui.mobileList=true;render();break;case'import':importDialog();break;case'clear-search':ui.search='';render();break;case'settings':switchView('settings');break;case'rules':switchView('rules');break;case'settings-tab':ui.settingsTab=id;render();break;case'rules-tab':ui.rulesTab=id;render();break;case'theme':{const dark=document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.dataset.theme=dark?'light':'dark';toast(dark?'已切换浅色外观。':'已切换深色外观。');break}case'menu':ui.menu=!ui.menu;render(true);break;case'rename':renameDialog();break;case'classify':classifyDialog();break;case'speakers':speakersDialog();break;case'tab':ui.tab=id;render();break;case'cite':case'seek':{const s=recordSources(current()).find(x=>x.id===id);ui.position=s.at;ui.evidence=id;render(true);announce('原文已定位到 '+time(s.at));break}case'close-evidence':ui.evidence=null;render(true);break;case'play':ui.playing=!ui.playing;if(ui.playing){toast('仅演示时间轴移动，没有音频播放。');clearInterval(playTimer);playTimer=setInterval(()=>{const r=current();ui.position=Math.min(ui.position+ui.speed,r.duration);const slider=document.getElementById('seek-range'),pos=document.getElementById('play-position');if(slider)slider.value=ui.position;if(pos)pos.textContent=time(ui.position);if(ui.position>=r.duration){ui.playing=false;clearInterval(playTimer);if(ui.view==='library')render(true)}},1000)}else clearInterval(playTimer);render(true);break;case'speed':ui.speed=ui.speed===1?1.5:ui.speed===1.5?2:1;render(true);break;case'open-template':ui.template=current().template;ui.view='rules';ui.rulesTab='prompts';render();break;case'template':ui.template=id;render();break;case'toggle-preview':ui.preview=!ui.preview;render(true);break;case'toggle-template':{const p=prompts.find(x=>x.id===id);p.enabled=!p.enabled;render(true);toast(p.enabled?'模板已启用。':'模板已停用，历史总结保持可读。');break}case'new-prompt':newPromptDialog();break;case'new-category':categoryDialog(id);break;case'edit-category':categoryDialog(b.dataset.kind,id);break;case'reveal-key':{const input=document.getElementById('api-key'),show=input.type==='password';input.type=show?'text':'password';b.setAttribute('aria-pressed',String(show));b.setAttribute('aria-label',show?'隐藏 API Key':'显示 API Key');break}case'test-model':testConnection();break;case'apply-storage':Object.assign(config,pendingStorage);pendingStorage=null;closeDialog();render();toast('已应用演示路径，没有创建目录或移动文件。');break;case'close-dialog':closeDialog();break;case'use-demo':selectImport('系统设计面试_示例.m4a');break;case'review':reviewDialog();break;case'export':exportDialog();break;case'download':download();break;case'regenerate':regenerateDialog();break;case'cancel-job':clearInterval(progressTimer);current().status='cancelled';render();announce('模拟任务已取消，可继续');break;case'resume':beginProgress(current(),current().stage||0);break}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;switch(f.getAttribute('id')){case'model-form':modelSave(f);break;case'storage-form':storagePreview(f);break;case'prompt-form':promptSave(f);break;case'new-prompt-form':newPromptSave(f);break;case'category-form':categorySave(f);break;case'rename-form':renameSave(f);break;case'import-form':importSave(f);break;case'speakers-form':saveSpeakers(f);break;case'classify-form':{const r=current(),d=new FormData(f);r.category=d.get('category');r.industry=d.get('industry');r.template=prompts.find(p=>p.category===r.category&&p.enabled)?.id||r.template;r.dirty=true;closeDialog();render(true);toast('演示分类已更新，可选择新模板重新整理。');break}case'regenerate-form':{const r=current(),d=new FormData(f);r.template=d.get('template');r.updating=true;r.transcriptOnly=false;closeDialog();beginProgress(r,3);break}}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='record-search'){ui.search=el.value;document.getElementById('records').innerHTML=recordRows();document.getElementById('result-count').textContent=filtered().length+' 条'}if(el.id==='seek-range'){ui.position=Number(el.value);document.getElementById('play-position').textContent=time(ui.position)}if(el.closest('#prompt-form')){const d=Object.fromEntries(new FormData(document.getElementById('prompt-form')));drafts[ui.template]=d;document.getElementById('prompt-dirty').textContent='有未保存修改'}if(['workspace-path','models-path','cache-path'].includes(el.id)){const f=document.getElementById('storage-form');document.getElementById('models-preview').textContent=joined(f.workspace.value,f.models.value);document.getElementById('cache-preview').textContent=joined(f.workspace.value,f.cache.value)}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='review-state')showReviewState(el.value);if(el.id==='library-filter'){ui.filter=el.value;render()}if(el.id==='speaker-filter'){ui.transcriptSpeaker=el.value;render(true)}if(el.dataset.check!==undefined){const r=current(),n=Number(el.dataset.check);r.checks=el.checked?[...new Set([...r.checks,n])]:r.checks.filter(x=>x!==n)}if(el.id==='rename-file-toggle')document.getElementById('rename-file').disabled=!el.checked;if(el.id==='import-file'&&el.files[0])selectImport(el.files[0].name);if(el.id==='import-mode'){const local=el.value==='local';document.getElementById('cloud-disclosure').hidden=local;document.getElementById('cloud-consent-label').hidden=local}if(el.id==='provider'){const form=document.getElementById('model-form');form.endpoint.value=el.value==='deepseek'?'https://api.deepseek.com':el.value==='local'?'http://localhost:11434/v1':'https://api.example.com/v1';form.model.value=el.value==='deepseek'?'deepseek-flash':el.value==='local'?'your-local-model':'your-model';document.getElementById('key-optional').textContent=el.value==='local'?'（本地服务可留空）':'';document.getElementById('model-message').textContent='配置已调整，请重新检查连接。'}if(el.id==='platform'){const f=document.getElementById('storage-form');f.workspace.value=el.value==='windows'?'D:\\Sonafolio':'/Users/you/Sonafolio';f.workspace.dispatchEvent(new Event('input',{bubbles:true}))}});
document.addEventListener('keydown',e=>{const modal=document.getElementById('dialog');if(e.key==='Tab'&&!e.ctrlKey&&!e.metaKey&&modal.open){const controls=[...modal.querySelectorAll('button:not(:disabled),input:not(:disabled):not([type=hidden]),select:not(:disabled),textarea:not(:disabled),a[href]')].filter(x=>x.getClientRects().length&&getComputedStyle(x).visibility!=='hidden');if(controls.length){e.preventDefault();const at=controls.indexOf(document.activeElement);controls[(at+(e.shiftKey?-1:1)+controls.length)%controls.length].focus()}return}if(e.key==='Escape'&&document.getElementById('dialog').open){e.preventDefault();closeDialog();return}if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=[...e.target.closest('[role="tablist"]').querySelectorAll('[role="tab"]')],i=tabs.indexOf(e.target),next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(i+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;const tab=tabs[next],action=tab.dataset.action,id=tab.dataset.id;tab.click();document.querySelector('[data-action="'+action+'"][data-id="'+id+'"]')?.focus()}if(e.key==='Escape'&&ui.menu){ui.menu=false;render(true)}});
const originalSummary=summary;
summary=function(r){if(r.transcriptOnly)return '<div class="reading-inner"><div class="empty">'+icon('file')+'<h2>本地转写已完成。</h2><p>这次只处理转写与说话人区分，没有调用云端总结。可以在逐字稿中查看演示片段，或设置模型后继续整理。</p><button class="btn primary" data-action="settings">设置整理模型</button></div></div>';return originalSummary(r)};
render();
</script>
