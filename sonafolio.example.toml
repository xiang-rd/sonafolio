[llm]
provider = "deepseek"
model = "deepseek-flash"
max_tokens = 8192
timeout_seconds = 120
thinking = false

# Copy to sonafolio.toml to override defaults.
# Store API keys through configure-deepseek, never in this file.

[storage]
# Relative to workspace; editing this file does NOT move existing files.
# The desktop storage settings provide previewed copy migration.
data_dir = "data"
models_dir = ".models"
cache_dir = ".cache"
