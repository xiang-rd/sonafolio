[package]
name = "sonafolio-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
libc = "0.2"
