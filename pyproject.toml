[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sonafolio"
version = "0.1.0"
description = "Turn recordings into speaker-aware, skill-organized records."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=14,<18",
  "numpy>=2,<3",
  "pydantic>=2.10,<3",
  "typer>=0.16,<1",
  "huggingface-hub>=0.34,<2",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "jinja2>=3.1,<4",
]

[project.optional-dependencies]
asr = ["pywhispercpp>=1.3,<2"]
diarization = ["pyannote.audio>=4,<5"]
alignment = ["transformers>=4.48,<5", "torch>=2.8,<3"]

[project.scripts]
sonafolio = "sonafolio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sonafolio"]

[tool.hatch.build]
exclude = ["/.venv/**", "/.runtime/**", "/.cache/**", "/.models/**", "/.tmp/**", "/data/**", "/.env*", "/sonafolio.toml", "/dist/**", "/build/**"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/scripts", "/tests", "/docs", "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/sonafolio.example.toml", "/.gitignore"]
